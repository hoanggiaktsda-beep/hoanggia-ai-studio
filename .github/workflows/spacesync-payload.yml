name: SpaceSync payload checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify script syntax and independent image payload
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          assert(scripts.length);
          for(const script of scripts)new vm.Script(script);
          assert(html.includes('views:await Promise.all'), 'Missing image data');
          assert(html.includes('reader.readAsDataURL(file)'), 'Missing image reader');
          assert(!html.includes('views:[...$("syncInput").files].slice(0,20).map((f)=>f.name)'), 'Still passing filenames');
          assert(html.includes('32*1024*1024'), 'Missing total payload cap');
          assert(html.includes('if(id!==loadId)return'), 'Missing stale upload guard');
          assert(html.includes('if(activeUrl)URL.revokeObjectURL(activeUrl)'), 'Missing URL cleanup');
          assert(html.includes('if(f.size>12*1024*1024)'), 'Missing upload limit');
          assert(html.includes('if(!j.image||typeof j.image!=="string")'), 'Missing render response validation');
          console.log('SpaceSync, upload and render checks passed');
          NODE
